name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Stage dummy secrets for build
        run: |
          python3 -c 'import base64, os; print("api_encryption_key: \"" + base64.b64encode(os.urandom(32)).decode() + "\"")' > secrets.yaml
          cat >> secrets.yaml <<EOF
          wifi_ssid: "ReleaseDummyNet"
          wifi_password: "release-dummy-password"
          ota_password: "release-dummy-ota-password"
          mqtt_host: "192.0.2.1"
          mqtt_user: "release-dummy-user"
          mqtt_password: "release-dummy-password"
          EOF

      - name: Build ESPHome firmware
        uses: esphome/build-action@v7
        with:
          yaml-file: fancontrol.yaml
          version: latest

      - name: Collect + rename release artifacts
        id: artifacts
        run: |
          VER=${{ steps.version.outputs.VERSION }}
          mkdir -p release
          cp .esphome/build/fancontrol/.pioenvs/fancontrol/firmware.bin         release/FanControl-${VER}.bin
          cp .esphome/build/fancontrol/.pioenvs/fancontrol/firmware.ota.bin     release/FanControl-${VER}.ota.bin
          cp .esphome/build/fancontrol/.pioenvs/fancontrol/firmware.factory.bin release/FanControl-${VER}.factory.bin
          cd release
          sha256sum FanControl-${VER}.bin         > FanControl-${VER}.bin.sha256
          sha256sum FanControl-${VER}.ota.bin     > FanControl-${VER}.ota.bin.sha256
          sha256sum FanControl-${VER}.factory.bin > FanControl-${VER}.factory.bin.sha256
          ls -la

      - name: Extract changelog section for this release
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Tag is vX.Y.Z; Keep-a-Changelog headings are [X.Y.Z] (no v prefix).
          VERSION_NO_V="${VERSION#v}"
          awk "/^## \[$VERSION_NO_V\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $VERSION_NO_V — falling back to tag message." > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "FanControl ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          fail_on_unmatched_files: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
