name: PlatformIO CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache PlatformIO + pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (lolin_d32)
        run: pio run -e lolin_d32

      # Host-side Unity tests for pure-logic modules (see test/README.md).
      # This is a hard gate: failures must fail the build.
      - name: Run unit tests (native)
        run: pio test -e native

      - name: Check binary size (<= 1.5 MB)
        run: |
          SIZE=$(stat -c%s .pio/build/lolin_d32/firmware.bin)
          echo "Firmware size: $SIZE bytes"
          if [ "$SIZE" -gt 1500000 ]; then
            echo "ERROR: firmware too large (>1.5MB)"
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: .pio/build/lolin_d32/firmware.bin
          retention-days: 30
