; FanControl — ESP32 ventilation controller for home battery room
; Target: LOLIN D32 ESP32, Arduino framework
; See ACCURUIMTE_VENTILATIE_PLAN.md §4

[env:lolin_d32]
platform = espressif32
board = lolin_d32
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; OTA upload (enable once device is on the network)
; upload_protocol = espota
; upload_port = fancontrol.local
; upload_flags = --auth=changeme

; Phase 1 dependencies + Phase 2 (MQTT).
; Phase 3 adds the AsyncWebServer stack (esp32async fork) + ElegantOTA.
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0

build_flags =
  -DCORE_DEBUG_LEVEL=3

[env:native]
platform = native
test_framework = unity
; Host-side tests compile only test/**/*.cpp and pull in header-only
; modules from src/ (e.g. fan_curve.h). src/*.cpp is NOT compiled here
; because it requires Arduino/ESP32 headers. Keep test_build_src = no.
test_build_src = no
build_flags =
  -std=gnu++17
  -I src
