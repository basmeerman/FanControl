; FanControl — ESP32 ventilation controller for home battery room
; Target: LOLIN D32 ESP32, Arduino framework
; See ACCURUIMTE_VENTILATIE_PLAN.md §4

[env:lolin_d32]
platform = espressif32
board = lolin_d32
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; OTA upload (enable once device is on the network)
; upload_protocol = espota
; upload_port = fancontrol.local
; upload_flags = --auth=changeme

; Phase 1 dependencies. Phase 2 adds PubSubClient;
; Phase 3 adds the AsyncWebServer stack (esp32async fork), ElegantOTA, ArduinoJson.
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14

build_flags =
  -DCORE_DEBUG_LEVEL=3

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
